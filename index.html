<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    textarea { width: 100%; min-height: 8rem; box-sizing: border-box; font: inherit; }
    button { margin-top: .5rem; padding: .4rem 1rem; font: inherit; }
    #result { margin-top: 1rem; padding: .75rem 1rem; border-radius: .5rem; border: 1px solid #ddd; }
    #result:empty { display: none; }
    #result.ready { border-color: #2e7d32; background: #f1f8f1; }
    #result.manual { border-color: #ed6c02; background: #fff6ed; }
    #result.error { border-color: #c62828; background: #fdf0f0; }
    .label { font-size: .85rem; color: #555; }
    .draft { white-space: pre-wrap; margin: .25rem 0 0; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form id="form">
    <label for="message">Текст обращения клиента</label>
    <textarea id="message" name="message" required></textarea>
    <button id="submit" type="submit">Разобрать</button>
  </form>
  <div id="result" role="status" aria-live="polite"></div>

  <script type="module">
    const TOPIC_LABELS = { delivery: "Доставка", pricing: "Цена", other: "Другое" };
    const form = document.querySelector("#form");
    const message = document.querySelector("#message");
    const button = document.querySelector("#submit");
    const result = document.querySelector("#result");
    let lastRequestId = 0;

    // Builds content with textContent only: model output is never inserted as HTML.
    function show(kind, ...nodes) {
      result.className = kind;
      result.replaceChildren(...nodes);
    }
    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      node.textContent = text;
      return node;
    }

    function render(httpStatus, body) {
      if (body?.status === "ready") {
        show("ready",
          el("div", "label", "Тема"),
          el("strong", "", TOPIC_LABELS[body.topic] ?? body.topic),
          el("div", "label", "Черновик ответа"),
          el("p", "draft", body.draft));
      } else if (body?.status === "manual_review") {
        show("manual",
          el("strong", "", "Нужен ручной разбор"),
          el("p", "", "AI не смог надёжно обработать заявку. Определите тему и напишите ответ вручную."));
      } else if (body?.status === "invalid_input") {
        show("error", el("p", "", "Введите текст обращения."));
      } else {
        show("error", el("p", "", `Сервис недоступен (HTTP ${httpStatus}). Попробуйте ещё раз.`));
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const requestId = ++lastRequestId;
      result.replaceChildren(); // the previous draft must never stay next to a new request
      result.className = "";
      button.disabled = true;
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: message.value }),
        });
        const body = await reply.json().catch(() => null);
        if (requestId === lastRequestId) render(reply.status, body);
      } catch {
        if (requestId === lastRequestId) render(0, null);
      } finally {
        if (requestId === lastRequestId) button.disabled = false;
      }
    });
  </script>
</body>
</html>
